<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#0F172A"/>
  <!-- Central Network Router / Switch -->
  <rect x="64" y="112" width="128" height="40" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="8"/>
  <!-- Router LED Indicators -->
  <circle cx="88" cy="132" r="5" fill="#10B981"/>
  <circle cx="104" cy="132" r="5" fill="#10B981"/>
  <circle cx="120" cy="132" r="5" fill="#38BDF8"/>
  <circle cx="136" cy="132" r="5" fill="#38BDF8"/>
  <rect x="156" y="126" width="20" height="12" rx="2" fill="#06B6D4"/>
  <!-- Antennas & Wireless Waves -->
  <line x1="88" y1="112" x2="88" y2="80" stroke="#06B6D4" stroke-width="8" stroke-linecap="round"/>
  <line x1="168" y1="112" x2="168" y2="80" stroke="#06B6D4" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 72 Q128 56 144 72" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 56 Q128 36 156 56" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <!-- Ethernet Connections to Devices -->
  <path d="M96 152 V192 H56" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M160 152 V192 H200" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 152 V200" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Connected Devices (Server & Clients) -->
  <rect x="36" y="180" width="24" height="28" rx="4" fill="#06B6D4"/>
  <rect x="196" y="180" width="24" height="28" rx="4" fill="#06B6D4"/>
  <circle cx="128" cy="204" r="8" fill="#10B981"/>
</svg>
